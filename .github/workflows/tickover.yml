name: Tickover

on:
  schedule:
    - cron: "17 * * * *"      # every hour, at 17 minutes past
  workflow_dispatch:          # lets you run it any time from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tickover
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Search for deals
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch_finder.py

      - name: Prepare web page
        run: |
          mkdir site
          cp report.html site/index.html
          cp deals.csv site/deals.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
